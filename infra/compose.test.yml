name: planner-test
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: planner_test
      POSTGRES_USER: planner_test
      POSTGRES_PASSWORD: isolated-test-only
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planner_test -d planner_test']
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ['start-dev', '--import-realm', '--http-port=8080']
    ports: ['127.0.0.1:58080:8080']
    volumes: ['./oidc-test-realm.json:/opt/keycloak/data/import/planner.json:ro']
